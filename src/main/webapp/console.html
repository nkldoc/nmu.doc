<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Signature Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --surface: #fff;
      --panel: #f7f9fc;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d5dce8;
      --blue: #2563eb;
      --blue-soft: #e8f0ff;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 64px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.25;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--green);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0;
    }

    .main {
      min-width: 0;
      padding: 18px;
      overflow: auto;
    }

    .side {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .search {
      max-width: 360px;
      flex: 1 1 220px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel h2 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      color: #344054;
      font-size: 12px;
      letter-spacing: 0;
    }

    tr:hover td {
      background: #fbfdff;
    }

    tr.selected td {
      background: var(--blue-soft);
    }

    .code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      color: #344054;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: #eaf7ee;
      color: #166534;
    }

    .badge.draft {
      background: #fff7ed;
      color: #9a3412;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .button {
      min-height: 36px;
      border: 1px solid #b8c4d6;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 11px;
      cursor: pointer;
    }

    .button:hover {
      background: var(--blue-soft);
      border-color: #9bb4e8;
    }

    .button.primary {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .button.danger {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .button.small {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: #344054;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #b8c4d6;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
      min-height: 38px;
    }

    textarea {
      resize: vertical;
      min-height: 84px;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .detail {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .detail strong {
      color: var(--ink);
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 620px) {
      .topbar,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>E-Signature Console</h1>
        <p class="subtitle">เพิ่ม ลบ แก้ไข Sign Template สำหรับ Spring Boot / PDFBox / WorkflowEngine</p>
      </div>
      <div class="status"><span class="dot"></span><span id="statusText">Ready</span><button class="button small" id="logoutButton" type="button">Logout</button></div>
    </header>

    <section class="layout">
      <section class="main">
        <div class="toolbar">
          <input class="search" id="searchInput" type="search" placeholder="ค้นหา template, workflow, role">
          <div class="actions">
            <button class="button" id="resetDemo" type="button">Reset Demo</button>
            <button class="button primary" id="newTemplate" type="button">Add Template</button>
          </div>
        </div>

        <div class="table-wrap">
          <table aria-label="Sign templates">
            <thead>
              <tr>
                <th>Template</th>
                <th>Sign Group</th>
                <th>Workflow</th>
                <th>Roles</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="templateRows"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState" hidden>ไม่พบข้อมูล Template</div>
      </section>

      <aside class="side">
        <section class="panel">
          <h2 id="formTitle">Add Template</h2>
          <form id="templateForm">
            <input id="templateId" type="hidden">
            <div class="field">
              <label for="templateCode">Template Code</label>
              <input id="templateCode" required placeholder="PO-APPROVAL-001">
            </div>
            <div class="field">
              <label for="templateName">Template Name</label>
              <input id="templateName" required placeholder="Purchase Approval">
            </div>
            <div class="field">
              <label for="signGroup">Sign Group</label>
              <input id="signGroup" required placeholder="Procurement">
            </div>
            <div class="field">
              <label for="workflowName">WorkflowEngine Process</label>
              <input id="workflowName" required placeholder="WF_PO_APPROVAL">
            </div>
            <div class="field">
              <label for="roles">Roles</label>
              <input id="roles" required placeholder="Requester, Finance, Director">
            </div>
            <div class="field">
              <label for="status">Status</label>
              <select id="status">
                <option value="Active">Active</option>
                <option value="Draft">Draft</option>
              </select>
            </div>
            <div class="field">
              <label for="callbackUrl">ExtJS/PHP Callback URL</label>
              <input id="callbackUrl" placeholder="/legacy/esign/callback.php">
            </div>
            <div class="field">
              <label for="notes">Notes</label>
              <textarea id="notes" placeholder="PDFBox field mapping, MSSQL table, or production note"></textarea>
            </div>
            <div class="actions">
              <button class="button primary" type="submit">Save</button>
              <button class="button" id="cancelEdit" type="button">Cancel</button>
            </div>
          </form>
        </section>

        <section class="panel" style="margin-top: 14px">
          <h2>Selected Detail</h2>
          <div class="detail" id="detailView">เลือก template จากตารางเพื่อดูรายละเอียด</div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const storageKey = "esign-console-templates";
    const demoTemplates = [
      {
        id: "tpl-po",
        code: "PO-APPROVAL-001",
        name: "Purchase Approval",
        signGroup: "Procurement",
        workflow: "WF_PO_APPROVAL",
        roles: "Requester, Finance, Director",
        status: "Active",
        callbackUrl: "/legacy/esign/callback.php",
        notes: "PDFBox signs visible fields. Store template in MSSQL esign_template."
      },
      {
        id: "tpl-hr",
        code: "HR-CONTRACT-001",
        name: "Employee Contract",
        signGroup: "Human Resource",
        workflow: "WF_HR_CONTRACT",
        roles: "HR, Employee, Director",
        status: "Draft",
        callbackUrl: "/legacy/hr/esign_callback.php",
        notes: "Waiting for production certificate mapping."
      }
    ];

    const els = {
      rows: document.querySelector("#templateRows"),
      empty: document.querySelector("#emptyState"),
      search: document.querySelector("#searchInput"),
      form: document.querySelector("#templateForm"),
      formTitle: document.querySelector("#formTitle"),
      templateId: document.querySelector("#templateId"),
      templateCode: document.querySelector("#templateCode"),
      templateName: document.querySelector("#templateName"),
      signGroup: document.querySelector("#signGroup"),
      workflowName: document.querySelector("#workflowName"),
      roles: document.querySelector("#roles"),
      status: document.querySelector("#status"),
      callbackUrl: document.querySelector("#callbackUrl"),
      notes: document.querySelector("#notes"),
      newTemplate: document.querySelector("#newTemplate"),
      cancelEdit: document.querySelector("#cancelEdit"),
      resetDemo: document.querySelector("#resetDemo"),
      detail: document.querySelector("#detailView"),
      statusText: document.querySelector("#statusText")
    };

    const authSession =
      JSON.parse(sessionStorage.getItem("eis-auth-session") || localStorage.getItem("eis-auth-session") || "null");

    if (authSession?.full_name || authSession?.username) {
      els.statusText.textContent = `Login: ${authSession.full_name || authSession.username}`;
    }

    let templates = loadTemplates();
    let selectedId = templates[0]?.id || "";

    function loadTemplates() {
      const saved = localStorage.getItem(storageKey);
      if (!saved) return [...demoTemplates];

      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [...demoTemplates];
      } catch {
        return [...demoTemplates];
      }
    }

    function saveTemplates() {
      localStorage.setItem(storageKey, JSON.stringify(templates));
    }

    function setStatus(text) {
      els.statusText.textContent = text;
    }

    function filteredTemplates() {
      const query = els.search.value.trim().toLowerCase();
      if (!query) return templates;

      return templates.filter((item) => [
        item.code,
        item.name,
        item.signGroup,
        item.workflow,
        item.roles,
        item.status
      ].join(" ").toLowerCase().includes(query));
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderRows() {
      const rows = filteredTemplates();
      els.empty.hidden = rows.length > 0;
      els.rows.innerHTML = rows.map((item) => `
        <tr class="${item.id === selectedId ? "selected" : ""}" data-id="${item.id}">
          <td>
            <strong>${escapeHtml(item.name)}</strong>
            <div class="code">${escapeHtml(item.code)}</div>
          </td>
          <td>${escapeHtml(item.signGroup)}</td>
          <td class="code">${escapeHtml(item.workflow)}</td>
          <td>${escapeHtml(item.roles)}</td>
          <td><span class="badge ${item.status === "Draft" ? "draft" : ""}">${escapeHtml(item.status)}</span></td>
          <td>
            <div class="actions">
              <button class="button small" type="button" data-action="edit" data-id="${item.id}">Edit</button>
              <button class="button small danger" type="button" data-action="delete" data-id="${item.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function renderDetail() {
      const item = templates.find((template) => template.id === selectedId);
      if (!item) {
        els.detail.textContent = "เลือก template จากตารางเพื่อดูรายละเอียด";
        return;
      }

      els.detail.innerHTML = `
        <div><strong>Template:</strong> ${escapeHtml(item.name)} <span class="code">${escapeHtml(item.code)}</span></div>
        <div><strong>Sign Group:</strong> ${escapeHtml(item.signGroup)}</div>
        <div><strong>Workflow:</strong> ${escapeHtml(item.workflow)}</div>
        <div><strong>Roles:</strong> ${escapeHtml(item.roles)}</div>
        <div><strong>Callback:</strong> <span class="code">${escapeHtml(item.callbackUrl || "-")}</span></div>
        <div><strong>Notes:</strong> ${escapeHtml(item.notes || "-")}</div>
      `;
    }

    function render() {
      renderRows();
      renderDetail();
    }

    function clearForm() {
      els.formTitle.textContent = "Add Template";
      els.templateId.value = "";
      els.templateCode.value = "";
      els.templateName.value = "";
      els.signGroup.value = "";
      els.workflowName.value = "";
      els.roles.value = "";
      els.status.value = "Active";
      els.callbackUrl.value = "/legacy/esign/callback.php";
      els.notes.value = "";
      els.templateCode.focus();
    }

    function editTemplate(id) {
      const item = templates.find((template) => template.id === id);
      if (!item) return;

      selectedId = id;
      els.formTitle.textContent = "Edit Template";
      els.templateId.value = item.id;
      els.templateCode.value = item.code;
      els.templateName.value = item.name;
      els.signGroup.value = item.signGroup;
      els.workflowName.value = item.workflow;
      els.roles.value = item.roles;
      els.status.value = item.status;
      els.callbackUrl.value = item.callbackUrl || "";
      els.notes.value = item.notes || "";
      setStatus(`Editing ${item.code}`);
      render();
    }

    function deleteTemplate(id) {
      const item = templates.find((template) => template.id === id);
      if (!item) return;

      const ok = confirm(`Delete template ${item.code}?`);
      if (!ok) return;

      templates = templates.filter((template) => template.id !== id);
      if (selectedId === id) selectedId = templates[0]?.id || "";
      saveTemplates();
      clearForm();
      setStatus(`Deleted ${item.code}`);
      render();
    }

    function upsertTemplate(event) {
      event.preventDefault();
      const id = els.templateId.value || crypto.randomUUID();
      const item = {
        id,
        code: els.templateCode.value.trim(),
        name: els.templateName.value.trim(),
        signGroup: els.signGroup.value.trim(),
        workflow: els.workflowName.value.trim(),
        roles: els.roles.value.trim(),
        status: els.status.value,
        callbackUrl: els.callbackUrl.value.trim(),
        notes: els.notes.value.trim()
      };

      const duplicate = templates.some((template) => template.code === item.code && template.id !== id);
      if (duplicate) {
        setStatus("Template Code ซ้ำ");
        els.templateCode.focus();
        return;
      }

      const index = templates.findIndex((template) => template.id === id);
      if (index >= 0) {
        templates[index] = item;
        setStatus(`Updated ${item.code}`);
      } else {
        templates.unshift(item);
        setStatus(`Added ${item.code}`);
      }

      selectedId = id;
      saveTemplates();
      clearForm();
      render();
    }

    els.rows.addEventListener("click", (event) => {
      const action = event.target.dataset.action;
      const row = event.target.closest("tr[data-id]");
      if (!row) return;

      if (action === "edit") {
        editTemplate(event.target.dataset.id);
        return;
      }

      if (action === "delete") {
        deleteTemplate(event.target.dataset.id);
        return;
      }

      selectedId = row.dataset.id;
      render();
    });

    els.form.addEventListener("submit", upsertTemplate);
    els.search.addEventListener("input", renderRows);
    els.newTemplate.addEventListener("click", clearForm);
    els.cancelEdit.addEventListener("click", () => {
      clearForm();
      setStatus("Ready");
    });
    els.resetDemo.addEventListener("click", () => {
      templates = [...demoTemplates];
      selectedId = templates[0].id;
      saveTemplates();
      clearForm();
      setStatus("Demo data restored");
      render();
    });
    document.querySelector("#logoutButton").addEventListener("click", () => {
      sessionStorage.removeItem("eis-auth-session");
      localStorage.removeItem("eis-auth-session");
      location.href = "login.html";
    });

    render();
  </script>
</body>
</html>
