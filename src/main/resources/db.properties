select.sign.type.document=SELECT a.sp_tor_id, a.type_id, a.page, a.position_y, \
       b.line, b.dc_user_id, b.full_name, b.position_name, b.action, b.org_name, \
       b.sign_date, b.row, b.col, b.step_sign, b.c_approved \
FROM sp_sign_type a \
INNER JOIN sp_sign_type_document b ON b.sp_sign_type_id = a.type_id \
WHERE a.sp_tor_id = :sp_tor_id AND b.document_id = :document_id \
ORDER BY a.type_id, b.line \ 

select.PATH_DOCUMENTS=D:\\Documents\\Sys\\supplies\\
select.sp_hdr_dtl.document=SELECT   \
       a.sp_tor_id,  \
       h.type_id,  \
       a.[page],  \
       a.position_y,  \
       a.line,  \
       a.i_signer,  \
       a.i_audit,  \
       a.dc_user_id,  \
       a.full_name,  \
       a.position_name,  \
       a.action_text as action,  \
       a.org_name,  \
       a.sign_date,   \
       COALESCE(ca.parsed_row, a.[row]) AS [row], \
       COALESCE(ca.parsed_col, a.[col]) AS [col], \
       a.step_sign,  \
       h.date_type,  \
       h.doc_type,  \
       MAX(a.line) OVER (PARTITION BY h.sp_tor_id, h.document_id) AS i_approved,  \
       1 as i_doc_approved,  \
       h.c_approve as c_approved,  \
       h.c_approve ,  \
       h.[url]  \
FROM dbo.sp_sign_doc_dtl a  \
INNER JOIN dbo.sp_sign_doc_hdr h  \
       ON h.sp_sign_doc_hdr_id = a.sp_sign_doc_hdr_id  \
CROSS APPLY ( \
    SELECT \
        CASE  \
            WHEN CHARINDEX(',', ISNULL(a.rc,'')) > 0  \
              THEN TRY_CAST(LTRIM(RTRIM(SUBSTRING(a.rc, 1, CHARINDEX(',', a.rc) - 1))) AS INT) \
            ELSE TRY_CAST(NULLIF(LTRIM(RTRIM(a.rc)), '') AS INT) \
        END AS parsed_row, \
        CASE  \
            WHEN CHARINDEX(',', ISNULL(a.rc,'')) > 0  \
              THEN TRY_CAST(LTRIM(RTRIM(SUBSTRING(a.rc, CHARINDEX(',', a.rc) + 1, 8000))) AS INT) \
            ELSE NULL \
        END AS parsed_col \
) AS ca \
WHERE a.i_signer = 1 \
  AND h.sp_tor_id = :sp_tor_id \
  AND h.document_id = :document_id \
ORDER BY a.sp_sign_doc_hdr_id, a.line; \



